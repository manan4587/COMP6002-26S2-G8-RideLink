name: ridelink
description: "A new Flutter project."
publish_to: 'none' 

version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State Management
  get: ^4.7.3
  get_storage: ^2.1.1

  # Network & Device
  dio: ^5.11.1
  connectivity_plus: ^7.3.2
  device_info_plus: ^13.3.0

  # Responsive UI & Theme
  flutter_screenutil: ^5.9.3

  # UI & Media Utils
  intl: ^0.20.3
  fluttertoast: ^10.0.2
  url_launcher: ^6.3.2
  cached_network_image: ^4.0.4
  flutter_svg: ^2.3.0
  crypto: ^3.0.7
  shimmer: ^4.0.0

  # Image & File Picker
  image_picker: ^1.2.3
  path_provider: ^2.1.6

  # Maps
  google_maps_flutter: ^2.18.2

  # Firebase
  firebase_core: ^4.15.0
  firebase_auth: ^6.7.0
  cloud_firestore: ^6.10.0
  firebase_storage: ^13.6.0
  firebase_messaging: ^16.7.0
  google_sign_in: ^6.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  remove_alpha_ios: true
  image_path: "assets/images/app_logo.png"
  min_sdk_android: 21
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/app_logo.png"

flutter:
  uses-material-design: true

  assets:
    - assets/
    - assets/inter/
    - assets/icons/
    - assets/images/

  fonts:
    - family: Inter
      fonts:
        - asset: assets/inter/Inter_18pt-Thin.ttf
